name: Port HBT v1.09 Local Parameter Patches
on:
  push:
    branches:
      - v1.09
permissions:
  contents: write
jobs:
  verify-patches:
    if: github.event.head_commit.message != 'Run HBT v1.09 parameter patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.09
        uses: actions/checkout@v4
        with:
          ref: v1.09
      - name: Verify all v1.09 patches
        shell: bash
        run: |
          python3 scripts/port_hbt_v109.py --check
          python3 scripts/port_hbt_v109_salma_thunder.py --check
  port-patches:
    if: github.event.head_commit.message == 'Run HBT v1.09 parameter patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.09
        uses: actions/checkout@v4
        with:
          ref: v1.09
          persist-credentials: true
      - name: Apply and verify v1.09 CSV patches
        shell: bash
        run: |
          python3 scripts/port_hbt_v109.py
          python3 scripts/port_hbt_v109_salma_thunder.py
          python3 scripts/port_hbt_v109.py --check
          python3 scripts/port_hbt_v109_salma_thunder.py --check
          git diff --check
          git diff --stat
      - name: Commit patched CSVs to v1.09
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SpEffectParam.csv ShopLineupParam.csv EquipParamGoods.csv
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Port Salma and Cleaving Thunder gameplay fixes to v1.09"
            git push origin HEAD:v1.09
          fi
